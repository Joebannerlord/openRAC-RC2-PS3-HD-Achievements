<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAC2 HD Achievements</title>
  <link rel="stylesheet" href="achievements.css">
  <script src="edge-shimmer.js" defer></script>
  <script src="achievements.js" defer></script>
</head>
<body>
  <main class="tracker" aria-labelledby="title">
    <header class="hero">
      <div>
        <h1 id="title">HD Trophy Collection</h1>
        <p id="summary" class="summary" aria-live="polite">Loading trophy catalog…</p>
      </div>
      <button id="refresh" type="button" disabled>Refresh</button>
    </header>
    <p id="notice" class="notice" role="status"></p>
    <section id="tiers" aria-label="Trophies"></section>
  </main>
</body>
</html>
